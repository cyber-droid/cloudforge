services:

  # frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cloudforge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"


  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudforge} -d ${POSTGRES_DB:-cloudforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cloudforge}:${POSTGRES_PASSWORD:-cloudforge_secret_pw}@postgres:5432/${POSTGRES_DB:-cloudforge_db}
      - SECRET_KEY=${SECRET_KEY:-supersecret_cloudforge_dev_jwt_key_change_in_production}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
    driver: local
